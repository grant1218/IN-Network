<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>IN — Make New York yours.</title><link rel="stylesheet" href="styles.css"/></head><body><main class="app-shell"><header class="topbar"><div><div class="eyebrow">IN</div><h1>Something is happening.</h1></div><button class="ghost" id="createOpen">CREATE</button></header><section class="hero-copy"><p>Plans from people you know — and ideas from people who want to make something happen.</p></section><nav class="mode-tabs"><button class="mode-tab active" data-mode="plans">HAPPENING</button><button class="mode-tab" data-mode="ideas">IDEAS</button><button class="mode-tab" data-mode="circles">SMALL GROUPS</button></nav><section class="interest-zone"><div class="interest-head"><div><div class="eyebrow">EXPLORE YOUR WORLD</div><h3>What are you into?</h3></div><button class="text-btn" id="clearInterests">SHOW EVERYTHING</button></div><div id="interestFilters" class="interest-filters"></div><div class="tiny interest-note">Interests shape what you see. They don't box you in.</div></section><section id="feed" class="feed"></section></main>
<dialog id="createDialog" class="modal"><form method="dialog" class="modal-card" id="createForm"><div class="modal-head"><div><div class="eyebrow">PUT IT OUT THERE</div><h2>What's in your head?</h2></div><button class="icon-btn" value="cancel">×</button></div><div class="create-type"><button type="button" class="type-choice active" data-type="plan"><strong>I'M DOING THIS</strong><span>I have a real plan.</span></button><button type="button" class="type-choice" data-type="idea"><strong>I'D BE IN</strong><span>I want to do it. I need people.</span></button></div><textarea id="planText" placeholder="I'd watch Formula One Sunday morning at a bar or someone's apartment." required></textarea><div class="field-row"><label>When?<input id="planWhen" type="text" placeholder="Sunday morning / Saturdays / next week" required/></label><label>Area / starting point<input id="planPlace" type="text" placeholder="UWS / Manhattan / flexible" required/></label></div><label>What is it about?<div id="createInterests" class="interest-filters create-tags"></div></label><label id="groupSizeLabel" class="hidden">Keep it small<select id="groupSize"><option value="4">Around 4 people</option><option value="6" selected>Around 6 people</option><option value="8">Around 8 people</option></select></label><label>Who can see it?<select id="planRadius"><option value="1">My direct INs</option><option value="2" selected>Friends of my INs</option><option value="3">Extended IN</option></select></label><button class="primary wide" type="submit" id="createSubmit">POST THE IN</button></form></dialog><dialog id="eventDialog" class="modal"><section class="modal-card event-detail" id="eventDetail"></section></dialog><script src="app.js"></script></body></html>
