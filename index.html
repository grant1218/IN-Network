<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>IN — Make New York yours.</title><link rel="stylesheet" href="styles.css"/></head><body><main class="app-shell"><header class="topbar"><button class="brand" data-view="plans">IN</button><div class="top-actions"><button class="ghost" id="createOpen">+ CREATE</button><button class="avatar-button" data-view="profile">G</button></div></header><section id="masthead"><div class="eyebrow">MAKE NEW YORK YOURS.</div><h1>Something is happening.</h1><p>Plans, ideas and small groups through people you trust.</p></section><nav class="mode-tabs"><button class="mode-tab active" data-view="plans">HAPPENING</button><button class="mode-tab" data-view="ideas">IDEAS</button><button class="mode-tab" data-view="circles">SMALL GROUPS</button><button class="mode-tab" data-view="network">MY IN</button></nav><section id="interestZone" class="interest-zone"><div class="interest-head"><div><div class="eyebrow">EXPLORE YOUR WORLD</div><h3>What are you into?</h3></div><button class="text-btn" id="clearInterests">SHOW ALL</button></div><div id="interestFilters" class="interest-filters"></div></section><section id="feed" class="feed"></section></main>
<dialog id="createDialog" class="modal"><form method="dialog" class="modal-card" id="createForm"><div class="modal-head"><div><div class="eyebrow">PUT IT OUT THERE</div><h2>What's in your head?</h2></div><button class="icon-btn" value="cancel">×</button></div><div class="create-type"><button type="button" class="type-choice active" data-type="plan"><strong>I'M DOING THIS</strong><span>I have a real plan.</span></button><button type="button" class="type-choice" data-type="idea"><strong>I'D BE IN</strong><span>I want to do it. I need people.</span></button></div><textarea id="planText" placeholder="Church Sunday at 10:30 then brunch after." required></textarea><div class="field-row"><label>When?<input id="planWhen" type="text" placeholder="Sunday morning / Saturdays" required></label><label>Area / starting point<input id="planPlace" type="text" placeholder="UWS / Manhattan / flexible" required></label></div><label>What is it about?<div id="createInterests" class="interest-filters create-tags"></div></label><label id="groupSizeLabel" class="hidden">Keep it small<select id="groupSize"><option value="4">Around 4 people</option><option value="6" selected>Around 6 people</option><option value="8">Around 8 people</option></select></label><label>Who can see it?<select id="planRadius"><option value="1">My direct INs</option><option value="2" selected>Friends of my INs</option><option value="3">Extended IN</option></select></label><div class="safety-contract"><strong>COME FOR THE THING.</strong><span>No dating, hookups or sexual solicitation. IN has no direct messages.</span></div><button class="primary wide" type="submit" id="createSubmit">POST THE IN</button></form></dialog><dialog id="eventDialog" class="modal"><section class="modal-card event-detail" id="eventDetail"></section></dialog><footer class="mobile-nav"><button data-view="plans">NOW</button><button data-view="ideas">IDEAS</button><button id="mobileCreate">＋</button><button data-view="network">MY IN</button><button data-view="profile">ME</button></footer><script src="app.js"></script></body></html>
